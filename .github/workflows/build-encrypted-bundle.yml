name: Build encrypted bundle

# Runs in the PRIVATE repo. Produces pwa/encrypted-bundle.json, which is the
# only artifact that should ever reach the PUBLIC repo / GitHub Pages.
#
# Required repo secret: CLAVE_DESPLIEGUE (high-entropy, e.g. `openssl rand -base64 32`)
# Optional repo secret: PUBLIC_REPO_DEPLOY_TOKEN (fine-grained PAT, "contents: write"
#   scoped ONLY to the public repo) if you want this workflow to also push the
#   result there. Left as a manual step below if you'd rather review each diff
#   before it goes public -- recommended, since this file is your only real
#   defense if the bundle format or KDF ever needs to change.

on:
  push:
    branches: [main]
    paths:
      - "tangos.json"
      - "scripts/build_encrypted_bundle.py"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA, not a tag/branch -- a tag can be moved
      # by the upstream maintainer (or an attacker who compromises their
      # account) to point at malicious code that would run with access to
      # CLAVE_DESPLIEGUE. Pin, and bump deliberately when you want an update.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography==46.0.6

      - name: Build encrypted bundle
        env:
          CLAVE_DESPLIEGUE: ${{ secrets.CLAVE_DESPLIEGUE }}
        run: |
          python3 scripts/build_encrypted_bundle.py \
            --tangos tangos.json \
            --salt 47 \
            --out pwa/encrypted-bundle.json

      - name: Smoke-test the bundle decrypts correctly
        env:
          CLAVE_DESPLIEGUE: ${{ secrets.CLAVE_DESPLIEGUE }}
        run: python3 scripts/decrypt_bundle_cli.py pwa/encrypted-bundle.json

      # Never `echo`, `print`, or write CLAVE_DESPLIEGUE to any log, artifact,
      # or file other than passing it as an env var to the two steps above.
      # GitHub Actions masks known secret values in logs, but that masking
      # only works for the literal string -- don't derive/transform it into
      # something the masker won't recognize and print that instead.

      - name: Upload bundle as build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa9 # v4.6.2
        with:
          name: encrypted-bundle
          path: pwa/encrypted-bundle.json
          retention-days: 7

      # Manual step (recommended): download the artifact above, review the
      # diff, and copy it into the public repo yourself. Automating that push
      # is possible (a second job with a scoped deploy token) but every extra
      # step that touches CLAVE_DESPLIEGUE-derived output is one more place a
      # misconfigured workflow could leak something -- keep this boundary
      # manual until you're confident in the pipeline.
